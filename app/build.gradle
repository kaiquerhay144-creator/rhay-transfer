plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rhaytransfer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rhaytransfer'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
